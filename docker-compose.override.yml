version: '3.8'

services:
  todo-app:
    build: .
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: jith
      SPRING_DATASOURCE_PASSWORD: 1301
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    networks:
      - backend